name: Deploy ML API

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ranjith280503/penguins-api:latest .

      - name: Push Docker image
        run: docker push ranjith280503/penguins-api:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ranjith280503/penguins-api:latest
            docker stop penguins-api || true
            docker rm penguins-api || true
            docker run -d \
              --name penguins-api \
              --restart unless-stopped \
              -p 127.0.0.1:8000:8000 \
              ranjith280503/penguins-api:latest
